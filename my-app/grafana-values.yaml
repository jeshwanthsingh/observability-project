grafana:
  defaultDashboardsEnabled: false
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-operated.monitoring:9090
    - name: Loki
      type: loki
      access: proxy
      url: http://localhost:3100
      isDefault: true
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring:3200
